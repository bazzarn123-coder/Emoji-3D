<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji   3D 👑✨ - Spatial Logic Puzzle Game</title>
    
    <!-- Browser Address Bar Icon (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emojiPurple: '#7209b7',
                        emojiPink: '#f72585',
                        emojiBlue: '#4cc9f0',
                        emojiDark: '#0f172a'
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle at 50% 15%, #2a085c 0%, #13032b 50%, #080114 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism panels */
        .glass-panel {
            background: rgba(30, 27, 75, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-btn:active {
            transform: scale(0.93);
        }

        /* Prevent scrolling during touch slide drag on board */
        #boardGrid {
            touch-action: none;
        }

        /* 3D Isometric Board Container */
        .board-viewport {
            perspective: 1200px;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .board-grid-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .board-viewport.iso-mode .board-grid-3d {
            transform: rotateX(36deg) rotateZ(-14deg) scale(0.92);
        }

        /* Extruded 3D Tile Styling */
        .emoji-tile {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
            box-shadow: 0 6px 0 var(--tile-shadow-color, #1e293b), 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .board-viewport.iso-mode .emoji-tile {
            box-shadow: 0 10px 0 var(--tile-shadow-color, #0f172a), 0 14px 22px rgba(0, 0, 0, 0.4);
        }

        .emoji-tile:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .emoji-tile.drag-active {
            transform: translateY(3px) scale(0.96) !important;
            filter: brightness(1.25);
        }

        /* Conflict error wobble */
        .emoji-tile.conflict {
            animation: conflictWobble 0.5s infinite alternate ease-in-out;
            box-shadow: 0 0 20px #f72585, 0 8px 0 #b5179e !important;
            border-color: #f72585 !important;
            z-index: 10;
        }

        @keyframes conflictWobble {
            0% { transform: translateY(0) rotate(0deg); background-color: #ff4d6d; }
            50% { transform: translateY(-3px) rotate(-4deg); }
            100% { transform: translateY(3px) rotate(4deg); background-color: #c77dff; }
        }

        /* Blocked / Dead-End Region Highlight */
        .emoji-tile.blocked-region {
            animation: blockedPulse 1.2s infinite alternate ease-in-out;
            border: 2.5px dashed #f72585 !important;
        }

        @keyframes blockedPulse {
            0% { filter: brightness(0.7) saturate(1.2); box-shadow: inset 0 0 15px rgba(247, 37, 133, 0.6); }
            100% { filter: brightness(1.1) saturate(1.8); box-shadow: inset 0 0 25px rgba(247, 37, 133, 0.9); }
        }

        /* 1-Cell Giveaway Region Highlight */
        .emoji-tile.giveaway-region {
            animation: giveawayPulse 1.5s infinite alternate ease-in-out;
            border: 3px solid #ffb703 !important;
            z-index: 5;
        }

        @keyframes giveawayPulse {
            0% { box-shadow: 0 0 12px #ffb703, inset 0 0 8px #ffb703; }
            100% { box-shadow: 0 0 24px #ffb703, inset 0 0 18px #ffb703; }
        }

        /* Entry Pop-in Animation */
        @keyframes popIn {
            0% { transform: scale(0.1) rotate(-20deg); opacity: 0; }
            70% { transform: scale(1.25) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Mascot Bounce Animation */
        @keyframes floatBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(3deg); }
        }

        .animate-float {
            animation: floatBounce 3s infinite ease-in-out;
        }

        /* Distinct High-Contrast 9 Region Color Palettes */
        .region-0 { background: linear-gradient(135deg, #ff8c00, #ff4500); --tile-shadow-color: #992600; } /* Bright Orange */
        .region-1 { background: linear-gradient(135deg, #8a2be2, #4b0082); --tile-shadow-color: #2e004f; } /* Royal Purple */
        .region-2 { background: linear-gradient(135deg, #ff1493, #c71585); --tile-shadow-color: #7d0a52; } /* Electric Magenta */
        .region-3 { background: linear-gradient(135deg, #1e90ff, #00008b); --tile-shadow-color: #000057; } /* Cobalt Blue */
        .region-4 { background: linear-gradient(135deg, #00e676, #008000); --tile-shadow-color: #004d00; } /* Emerald Green */
        .region-5 { background: linear-gradient(135deg, #ffd700, #b8860b); --tile-shadow-color: #6e5000; } /* Golden Yellow */
        .region-6 { background: linear-gradient(135deg, #00ffff, #008b8b); --tile-shadow-color: #005252; } /* Neon Cyan */
        .region-7 { background: linear-gradient(135deg, #ff1a1a, #990000); --tile-shadow-color: #590000; } /* Crimson Red */
        .region-8 { background: linear-gradient(135deg, #d8bfd8, #6a0d91); --tile-shadow-color: #3b0054; } /* Violet Indigo */

        /* Speech bubble pointer */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: rgba(30, 27, 75, 0.85) transparent;
            display: block;
            width: 0;
        }

        /* Particle Overlay Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

    <script>
        const gameState = {
            N: 5,                  // Grid dimension (4 to 8)
            levelIndex: 0,
            currentLevel: null,    // Holds { N, regions, solution, giveawayPos }
            board: [],             // Cell state: { value: 'EMPTY'|'EMOJI'|'CROSS', isConflict: false, isBlocked: false }
            activeTool: 'emoji',   // 'emoji', 'cross', 'erase'
            selectedEmoji: '😎',
            unlockedEmojis: ['😎', '👑', '🤩'],
            stars: 0,
            timerSeconds: 0,
            timerInterval: null,
            is3D: true,
            history: [],
            redoStack: [],
            isMuted: false,
            // Touch & Slide Drag State
            isDragging: false,
            dragLastCellIdx: null,
            dragTargetValue: 'CROSS'
        };

        const EMOJI_CATALOG = [
            { emoji: '😎', name: 'Cool Sunglasses', price: 0 },
            { emoji: '👑', name: 'Royal Crown', price: 0 },
            { emoji: '🤩', name: 'Superstar', price: 0 },
            { emoji: '🥳', name: 'Party Face', price: 5 },
            { emoji: '🤠', name: 'Cowboy', price: 10 },
            { emoji: '👽', name: 'Cosmic Alien', price: 15 },
            { emoji: '🤖', name: 'Cyber Robot', price: 20 },
            { emoji: '🐱', name: 'Kitty  ', price: 25 }
        ];

        // Web Audio Synthesizer
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (gameState.isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.07);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            } else if (type === 'cross') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.linearRampToValueAtTime(160, now + 0.05);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.35);
                });
            }
        }

        /**
         * Fast Backtracking Solver
         * Counts valid   assignments given a region partition and 8-neighbor touch rules.
         * Stops counting when solutionCount >= 2 for speed.
         */
        function countSolutions(regions, N) {
            let solutionCount = 0;
            const colsUsed = new Array(N).fill(false);
            const regionsUsed = new Array(N).fill(false);
            const  Cols = new Array(N).fill(-1);

            function solve(row) {
                if (row === N) {
                    solutionCount++;
                    return;
                }

                for (let c = 0; c < N; c++) {
                    if (colsUsed[c]) continue;
                    
                    const reg = regions[row][c];
                    if (regionsUsed[reg]) continue;

                    // 8-neighbor touch restriction (king move check with adjacent row)
                    if (row > 0 && Math.abs(c -  Cols[row - 1]) <= 1) {
                        continue;
                    }

                    // Place  
                    colsUsed[c] = true;
                    regionsUsed[reg] = true;
                     Cols[row] = c;

                    solve(row + 1);

                    // Backtrack
                    colsUsed[c] = false;
                    regionsUsed[reg] = false;
                     Cols[row] = -1;

                    if (solutionCount >= 2) return; // Early exit if not unique
                }
            }

            solve(0);
            return solutionCount;
        }

        function findRandomNonTouching (N) {
            let solution = null;

            function solve(row, currentCols) {
                if (row === N) {
                    solution = currentCols.map((c, r) => ({ r, c }));
                    return true;
                }

                const cols = Array.from({ length: N }, (_, i) => i).sort(() => Math.random() - 0.5);

                for (let c of cols) {
                    let valid = true;
                    if (row > 0 && Math.abs(c - currentCols[row - 1]) <= 1) {
                        valid = false;
                    }
                    if (valid) {
                        currentCols.push(c);
                        if (solve(row + 1, currentCols)) return true;
                        currentCols.pop();
                    }
                }
                return false;
            }

            for (let attempts = 0; attempts < 50; attempts++) {
                if (solve(0, [])) return solution;
            }

            // Fallbacks for small N
            if (N === 4) return [{r:0,c:1},{r:1,c:3},{r:2,c:0},{r:3,c:2}];
            if (N === 5) return [{r:0,c:0},{r:1,c:3},{r:2,c:1},{r:3,c:4},{r:4,c:2}];
            return Array.from({length: N}, (_, i) => ({ r: i, c: (i * 2) % N }));
        }

        function generateUniquePuzzle(N) {
            let attempts = 0;

            while (attempts < 400) {
                attempts++;
                const Q = findRandomNonTouching (N);
                if (!Q) continue;

                // Pick 1   to be in a 1-CELL COLOR REGION (the giveaway start box!)
                const giveawayIndex = Math.floor(Math.random() * N);
                const giveawayPos = Q[giveawayIndex];

                const regions = Array.from({ length: N }, () => Array(N).fill(-1));

                // Region 0 is strictly a 1-CELL REGION containing ONLY  Pos
                regions[giveawayPos.r][giveawayPos.c] = 0;

                // Assign seed cells for Regions 1..N-1 from remaining  
                const other  = Q.filter((_, idx) => idx !== giveawayIndex);
                for (let regId = 1; regId < N; regId++) {
                    const q = other [regId - 1];
                    regions[q.r][q.c] = regId;
                }

                // Grow regions 1..N-1 to cover all remaining N^2 - 1 cells
                growRegions(regions, N);

                // Verify STRICT UNIQUE SOLUTION and EXACTLY N DISTINCT REGIONS
                if (verifyRegionsValid(regions, N) && countSolutions(regions, N) === 1) {
                    return { N, regions, solution: Q, giveawayPos };
                }
            }

            return generateFallbackUniquePuzzle(N);
        }

        function verifyRegionsValid(regions, N) {
            const foundRegs = new Set();
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (regions[r][c] === -1) return false;
                    foundRegs.add(regions[r][c]);
                }
            }
            return foundRegs.size === N;
        }

        function growRegions(regions, N) {
            let unassignedCount = N * N - N; // 1 assigned to giveaway region, N-1 seeds
            const frontiers = Array.from({ length: N }, () => []);

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const reg = regions[r][c];
                    if (reg > 0) frontiers[reg].push({ r, c });
                }
            }

            while (unassignedCount > 0) {
                const activeRegions = [];
                for (let reg = 1; reg < N; reg++) {
                    const neighbors = [];
                    for (let cell of frontiers[reg]) {
                        const adj = [
                            { r: cell.r - 1, c: cell.c },
                            { r: cell.r + 1, c: cell.c },
                            { r: cell.r, c: cell.c - 1 },
                            { r: cell.r, c: cell.c + 1 }
                        ];
                        for (let a of adj) {
                            if (a.r >= 0 && a.r < N && a.c >= 0 && a.c < N && regions[a.r][a.c] === -1) {
                                neighbors.push(a);
                            }
                        }
                    }
                    if (neighbors.length > 0) {
                        activeRegions.push({ reg, neighbors });
                    }
                }

                if (activeRegions.length === 0) {
                    for (let r = 0; r < N; r++) {
                        for (let c = 0; c < N; c++) {
                            if (regions[r][c] === -1) {
                                regions[r][c] = 1;
                                unassignedCount--;
                            }
                        }
                    }
                    break;
                }

                const chosen = activeRegions[Math.floor(Math.random() * activeRegions.length)];
                const newCell = chosen.neighbors[Math.floor(Math.random() * chosen.neighbors.length)];
                regions[newCell.r][newCell.c] = chosen.reg;
                frontiers[chosen.reg].push(newCell);
                unassignedCount--;
            }
        }

        function generateFallbackUniquePuzzle(N) {
            const Q = findRandomNonTouching (N);
            const giveawayPos = Q[0];
            const regions = Array.from({ length: N }, () => Array(N).fill(-1));

            regions[giveawayPos.r][giveawayPos.c] = 0;
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (regions[r][c] === -1) {
                        regions[r][c] = (r + c) % (N - 1) + 1;
                    }
                }
            }
            return { N, regions, solution: Q,  Pos };
        }

        function validateBoardState() {
            const N = gameState.N;
            const board = gameState.board;
            const regions = gameState.currentLevel.regions;

            board.forEach(c => {
                c.isConflict = false;
                c.isBlocked = false;
            });

            const emojiCells = [];
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const idx = r * N + c;
                    if (board[idx].value === 'EMOJI') {
                        emojiCells.push({ r, c, idx, region: regions[r][c] });
                    }
                }
            }

            // Direct Conflict Checking
            let directConflictCount = 0;
            for (let i = 0; i < emojiCells.length; i++) {
                for (let j = i + 1; j < emojiCells.length; j++) {
                    const a = emojiCells[i];
                    const b = emojiCells[j];

                    const sameRow = a.r === b.r;
                    const sameCol = a.c === b.c;
                    const sameRegion = a.region === b.region;
                    const isAdjacentTouch = Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1;

                    if (sameRow || sameCol || sameRegion || isAdjacentTouch) {
                        board[a.idx].isConflict = true;
                        board[b.idx].isConflict = true;
                        directConflictCount++;
                    }
                }
            }

            // Dead-End Region Forward Checking
            let deadRegionCount = 0;
            for (let regId = 0; regId < N; regId++) {
                const hasEmoji = emojiCells.some(e => e.region === regId);

                if (!hasEmoji) {
                    let validSpotsInRegion = 0;
                    for (let r = 0; r < N; r++) {
                        for (let c = 0; c < N; c++) {
                            if (regions[r][c] === regId) {
                                const idx = r * N + c;
                                if (board[idx].value === 'CROSS') continue;

                                let cellValid = true;
                                for (let placed of emojiCells) {
                                    if (placed.r === r || placed.c === c || (Math.abs(placed.r - r) <= 1 && Math.abs(placed.c - c) <= 1)) {
                                        cellValid = false;
                                        break;
                                    }
                                }
                                if (cellValid) validSpotsInRegion++;
                            }
                        }
                    }

                    if (validSpotsInRegion === 0) {
                        deadRegionCount++;
                        for (let r = 0; r < N; r++) {
                            for (let c = 0; c < N; c++) {
                                if (regions[r][c] === regId) {
                                    board[r * N + c].isBlocked = true;
                                }
                            }
                        }
                    }
                }
            }

            document.getElementById('conflictCountDisplay').innerText = directConflictCount + deadRegionCount;

            if (directConflictCount > 0) {
                playSound('error');
                updateMascot("Warning! Emojis clash in row, col, region, or touch! ⚠️", "shocked");
            } else if (deadRegionCount > 0) {
                playSound('error');
                updateMascot("Dead-End Block! A color region has NO valid spaces left! ✖", "shocked");
            } else if (emojiCells.length > 0) {
                updateMascot("Great progress! Keep using Slide ✖ to eliminate options! ✨", "happy");
            } else {
                announceGiveawayTip();
            }
        }

        function setupDragAndSlideInteractions() {
            const boardGrid = document.getElementById('boardGrid');
            let lastTapTime = 0;
            let lastTapIdx = null;

            function getCellFromPoint(x, y) {
                const el = document.elementFromPoint(x, y);
                if (!el) return null;
                const tile = el.closest('.emoji-tile');
                if (!tile) return null;
                return {
                    r: parseInt(tile.dataset.r),
                    c: parseInt(tile.dataset.c),
                    idx: parseInt(tile.dataset.idx),
                    tile: tile
                };
            }

            function processCellInteraction(cellData, isStart = false) {
                if (!cellData) return;
                const { idx, tile } = cellData;

                if (gameState.dragLastCellIdx === idx && !isStart) return;
                gameState.dragLastCellIdx = idx;

                const cell = gameState.board[idx];

                if (isStart) pushHistory();

                const now = Date.now();
                const isDoubleTap = isStart && (now - lastTapTime < 300) && (lastTapIdx === idx);

                if (isStart) {
                    if (isDoubleTap) {
                        lastTapTime = 0;
                        lastTapIdx = null;
                    } else {
                        lastTapTime = now;
                        lastTapIdx = idx;
                    }
                }

                if (isDoubleTap) {
                    // Double tap always toggles/places Emoji
                    cell.value = cell.value === 'EMOJI' ? 'EMPTY' : 'EMOJI';
                    cell.emoji = gameState.selectedEmoji;
                    playSound('pop');
                } else if (gameState.activeTool === 'emoji') {
                    if (isStart) {
                        cell.value = cell.value === 'EMOJI' ? 'EMPTY' : 'EMOJI';
                        cell.emoji = gameState.selectedEmoji;
                        playSound('pop');
                    }
                } else if (gameState.activeTool === 'cross') {
                    if (isStart) {
                        gameState.dragTargetValue = cell.value === 'CROSS' ? 'EMPTY' : 'CROSS';
                    }
                    cell.value = gameState.dragTargetValue;
                    playSound('cross');
                    tile.classList.add('drag-active');
                    setTimeout(() => tile.classList.remove('drag-active'), 150);
                } else if (gameState.activeTool === 'erase') {
                    cell.value = 'EMPTY';
                    playSound('pop');
                    tile.classList.add('drag-active');
                    setTimeout(() => tile.classList.remove('drag-active'), 150);
                }

                validateBoardState();
                renderBoard();
                checkVictory();
            }

            boardGrid.addEventListener('pointerdown', (e) => {
                gameState.isDragging = true;
                gameState.dragLastCellIdx = null;
                const cellData = getCellFromPoint(e.clientX, e.clientY);
                if (cellData) processCellInteraction(cellData, true);
            });

            window.addEventListener('pointermove', (e) => {
                if (!gameState.isDragging) return;
                const cellData = getCellFromPoint(e.clientX, e.clientY);
                if (cellData) processCellInteraction(cellData, false);
            });

            window.addEventListener('pointerup', () => {
                gameState.isDragging = false;
                gameState.dragLastCellIdx = null;
            });

            window.addEventListener('pointercancel', () => {
                gameState.isDragging = false;
                gameState.dragLastCellIdx = null;
            });
        }

            if (gameState.history.length === 0) return;

        function burstConfetti() {
            particles = [];
            const colors = ['#f72585', '#4cc9f0', '#7209b7', '#ffb703', '#06d6a0'];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.rot += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rot * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });

            particles = particles.filter(p => p.y < canvas.height);
            if (particles.length > 0) {
                requestAnimationFrame(animateParticles);
            }
        }

                const btn = document.createElement('button');
                btn.className = `glass-btn py-2.5 rounded-2xl flex flex-col items-center justify-center font-bold transition ${
                    i === gameState.levelIndex ? 'border-2 border-cyan-400 bg-cyan-500/20' : ''
                }`;
                btn.innerHTML = `
                    <span class="text-[9px] text-cyan-300">PUZZLE</span>
                    <span class="text-sm text-slate-100">${i + 1}</span>
                    <span class="text-[10px] text-amber-400">⭐⭐⭐</span>
                `;
                btn.addEventListener('click', () => {
                    loadLevel(i, gameState.N);
                    document.getElementById('levelModal').classList.add('hidden');
                });
                container.appendChild(btn);
            }
        }

        function updateStarDisplays() {
            document.getElementById('starCounterDisplay').innerText = gameState.stars;
            document.getElementById('shopStarCounter').innerText = gameState.stars;
        }

        function saveLocalStorage() {
            const data = {
                stars: gameState.stars,
                unlockedEmojis: gameState.unlockedEmojis,
                selectedEmoji: gameState.selectedEmoji
            };
            localStorage.setItem('emoji_ _3d_save', JSON.stringify(data));
        }

        function loadLocalStorage() {
            const saved = localStorage.getItem('emoji_ _3d_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState.stars = parsed.stars || 0;
                    gameState.unlockedEmojis = parsed.unlockedEmojis || ['😎', '👑', '🤩'];
                    gameState.selectedEmoji = parsed.selectedEmoji || '😎';
                    document.getElementById('selectedEmojiToolIcon').innerText = gameState.selectedEmoji;
                    document.getElementById('activeThemeIcon').innerText = gameState.selectedEmoji;
                } catch(e) {}
            }
            updateStarDisplays();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalStorage();
            setupDragAndSlideInteractions();

            // 3D Perspective Toggle
            const toggle3DBtn = document.getElementById('toggle3DBtn');
            const boardViewport = document.getElementById('boardViewport');
            toggle3DBtn.addEventListener('click', () => {
                gameState.is3D = !gameState.is3D;
                if (gameState.is3D) {
                    boardViewport.classList.add('iso-mode');
                    document.getElementById('perspectiveIcon').className = 'fa-solid fa-cube text-base sm:text-lg';
                } else {
                    boardViewport.classList.remove('iso-mode');
                    document.getElementById('perspectiveIcon').className = 'fa-solid fa-square text-base sm:text-lg';
                }
                playSound('pop');
            });

            // Mute Toggle
            document.getElementById('toggleMuteBtn').addEventListener('click', () => {
                gameState.isMuted = !gameState.isMuted;
                document.getElementById('muteIcon').className = gameState.isMuted 
                    ? "fa-solid fa-volume-xmark text-base sm:text-lg text-rose-400" 
                    : "fa-solid fa-volume-high text-base sm:text-lg text-slate-300";
            });

            // Tool Switch Buttons
            const toolEmojiBtn = document.getElementById('toolEmojiBtn');
            const toolCrossBtn = document.getElementById('toolCrossBtn');
            const toolEraseBtn = document.getElementById('toolEraseBtn');

            function setActiveTool(tool) {
                gameState.activeTool = tool;
                [toolEmojiBtn, toolCrossBtn, toolEraseBtn].forEach(b => {
                    b.className = "flex-1 py-2.5 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center space-x-1.5 text-slate-300 hover:bg-white/10 transition";
                });

                if (tool === 'emoji') {
                    toolEmojiBtn.className = "flex-1 py-2.5 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center space-x-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg transition";
                } else if (tool === 'cross') {
                    toolCrossBtn.className = "flex-1 py-2.5 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center space-x-1.5 bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-lg transition";
                } else if (tool === 'erase') {
                    toolEraseBtn.className = "flex-1 py-2.5 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center space-x-1.5 bg-gradient-to-r from-slate-600 to-slate-700 text-white shadow-lg transition";
                }
                playSound('pop');
            }

            toolEmojiBtn.addEventListener('click', () => setActiveTool('emoji'));
            toolCrossBtn.addEventListener('click', () => setActiveTool('cross'));
            toolEraseBtn.addEventListener('click', () => setActiveTool('erase'));

            // Secondary Toolbar Action Listeners
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('giveawayHelperBtn').addEventListener('click', highlightGiveawayPoint);
            document.getElementById('resetBtn').addEventListener('click', resetCurrentLevel);

            // Mascot Pet Interaction
            document.getElementById('mascotAvatar').addEventListener('click', highlightGiveawayPoint);

            // Modal Controls
            const levelModal = document.getElementById('levelModal');
            document.getElementById('openLevelModalBtn').addEventListener('click', () => {
                renderLevelCards();
                levelModal.classList.remove('hidden');
            });
            document.getElementById('closeLevelModalBtn').addEventListener('click', () => levelModal.classList.add('hidden'));

            // Grid Dimension Switches (4x4 to 8x8)
            document.querySelectorAll('.grid-size-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.grid-size-btn').forEach(b => {
                        b.className = "grid-size-btn py-2 rounded-xl text-xs font-bold border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10";
                    });
                    e.currentTarget.className = "grid-size-btn py-2 rounded-xl text-xs font-bold border border-cyan-500/40 bg-cyan-500/20 text-cyan-300";
                    const newN = parseInt(e.currentTarget.dataset.size);
                    loadLevel(0, newN);
                    renderLevelCards();
                });
            });

            document.getElementById('generateUniqueBtn').addEventListener('click', () => {
                const randomIdx = Math.floor(Math.random() * 100);
                loadLevel(randomIdx, gameState.N);
                levelModal.classList.add('hidden');
            });

            // Shop Modal Controls
            const shopModal = document.getElementById('shopModal');
            document.getElementById('openShopBtn').addEventListener('click', () => {
                renderShopGrid();
                shopModal.classList.remove('hidden');
            });
            document.getElementById('closeShopModalBtn').addEventListener('click', () => shopModal.classList.add('hidden'));

            // Victory Controls
            document.getElementById('vicReplayBtn').addEventListener('click', () => {
                document.getElementById('victoryModal').classList.add('hidden');
                resetCurrentLevel();
            });

            document.getElementById('vicNextBtn').addEventListener('click', () => {
                document.getElementById('victoryModal').classList.add('hidden');
                loadLevel(gameState.levelIndex + 1, gameState.N);
            });

            // Initial Launch
            loadLevel(0, 5);
        });
    </script>
</body>
</html>
